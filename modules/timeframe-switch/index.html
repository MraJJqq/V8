<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>周期切换</title>
<style>
@font-face {
  font-family: 'Chakra Petch';
  src: url('../../assets/fonts/ChakraPetch-Bold.ttf') format('truetype');
  font-weight: 700;
  font-display: swap;
}
:root {
  --ink: #e8f0ff;
  --mute: #7f8db0;
  --up: #2ee6a6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: transparent;
  font-family: 'Chakra Petch', sans-serif;
  user-select: none;
}
.tf {
  position: absolute;
  bottom: 0;
  left: 0;
  width: auto;
  height: 31.17%;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-start;
  gap: 0;
  perspective: 700px;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  overscroll-behavior: contain;
  touch-action: pan-y;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 16%, #000 84%, transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, #000 16%, #000 84%, transparent 100%);
  scrollbar-width: none;
}
.tf::-webkit-scrollbar { display: none; }
.tf button {
  border: 0;
  background: none;
  padding: 0 clamp(4px, 1vw, 8px);
  width: auto;
  height: 20%;
  min-height: 0;
  flex: 0 0 20%;
  scroll-snap-align: center;
  font: 700 clamp(28px, 4.3vh, 44px)/1.05 'Chakra Petch', sans-serif;
  color: var(--mute);
  cursor: pointer;
  transform-style: preserve-3d;
  -webkit-tap-highlight-color: transparent;
  transition:
    font-size .35s cubic-bezier(.2,.8,.2,1),
    color .35s,
    transform .35s cubic-bezier(.2,.8,.2,1),
    filter .35s;
}
.tf button[aria-pressed="true"] {
  font-size: clamp(42px, 6.45vh, 66px);
  color: var(--ink);
  transform: translateZ(24px);
  filter:
    drop-shadow(0 0 12px rgba(46,230,166,.7))
    drop-shadow(0 10px 14px rgba(0,0,0,.6));
}
.tf button:focus-visible {
  outline: 2px solid var(--up);
  outline-offset: 2px;
  border-radius: 8px;
}
</style>
</head>
<body>
<div class="tf" role="group" aria-label="周期">
  <button aria-pressed="false">1H</button>
  <button aria-pressed="false">2H</button>
  <button aria-pressed="true">4H</button>
  <button aria-pressed="false">8H</button>
  <button aria-pressed="false">D</button>
</div>
<script>
(() => {
  const tf = document.querySelector('.tf');
  const src = [...tf.querySelectorAll('button')];
  const n = src.length;
  const valid = ['1H', '2H', '4H', '8H', 'D'];
  const pressedIdx = Math.max(0, src.findIndex(b => b.getAttribute('aria-pressed') === 'true'));

  const clone = () => src.map(b => b.cloneNode(true));
  tf.prepend(...clone(), ...clone());
  tf.append(...clone(), ...clone());
  const all = [...tf.querySelectorAll('button')];

  const centerOf = i => all[i].offsetTop + all[i].offsetHeight / 2 - tf.clientHeight / 2;
  const H = () => all[n].offsetTop - all[0].offsetTop;
  let selected = '';

  const mark = (notify = true) => {
    const mid = tf.scrollTop + tf.clientHeight / 2;
    let best = 0, d = Infinity;
    all.forEach((b, i) => {
      const x = Math.abs(b.offsetTop + b.offsetHeight / 2 - mid);
      if (x < d) { d = x; best = i; }
    });
    const key = all[best].textContent.trim();
    all.forEach(b => b.setAttribute('aria-pressed', b.textContent.trim() === key));
    if (notify && key !== selected) {
      selected = key;
      window.parent.postMessage({ type: 'VEGAS_TIMEFRAME_SELECT', timeframe: key }, location.origin);
    } else if (!selected) {
      selected = key;
    }
  };

  const wrap = () => {
    const h = H();
    if (tf.scrollTop < h * 1.5) tf.scrollTop += h;
    else if (tf.scrollTop > h * 2.5) tf.scrollTop -= h;
  };

  let timer;
  tf.addEventListener('scroll', () => {
    mark();
    clearTimeout(timer);
    timer = setTimeout(wrap, 120);
  }, { passive: true });

  tf.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    tf.scrollTo({ top: centerOf(all.indexOf(b)), behavior: 'smooth' });
  });

  const setFromParent = value => {
    if (!valid.includes(value)) return;
    const mid = tf.scrollTop + tf.clientHeight / 2;
    let best = -1, d = Infinity;
    all.forEach((b, i) => {
      if (b.textContent.trim() !== value) return;
      const x = Math.abs(b.offsetTop + b.offsetHeight / 2 - mid);
      if (x < d) { d = x; best = i; }
    });
    if (best >= 0) {
      selected = value;
      all.forEach(b => b.setAttribute('aria-pressed', b.textContent.trim() === value));
      tf.scrollTo({ top: centerOf(best), behavior: 'auto' });
    }
  };

  window.addEventListener('message', event => {
    if (event.origin !== location.origin || event.source !== window.parent) return;
    const data = event.data;
    if (!data || typeof data !== 'object' || data.type !== 'VEGAS_TIMEFRAME_SET') return;
    setFromParent(data.timeframe);
  });

  tf.scrollTop = centerOf(2 * n + pressedIdx);
  mark(false);
})();
</script>
</body>
</html>
