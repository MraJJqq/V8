name: V8 read-only K-line audit

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/v8-kline-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit all instruments and timeframes using V8 controller rules
        env:
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: |
          cat > /tmp/audit.py <<'PY'
          import csv, json, math, os, re, time, datetime, urllib.request, urllib.parse, urllib.error
          from pathlib import Path

          catalog = Path("modules/shared/instrument-catalog.js").read_text()
          defs = re.findall(r'\["([^"]+)","([^"]+)","([^"]+)","([^"]+)","([^"]+)"\]', catalog)
          if len(defs) != 22:
              raise SystemExit(f"Expected 22 catalog entries, found {len(defs)}")
          symbols = [(x[0], x[1]) for x in defs]
          base = "https://api.gateio.ws/api/v4/futures/usdt"
          now = int(time.time())
          start = 0
          PAGE = 2000
          report = []

          def api(params):
              url = base + "/candlesticks?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={"Accept":"application/json","User-Agent":"V8-read-only-kline-audit/2.0"})
              last_error = None
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          body = json.load(r)
                      if not isinstance(body, list):
                          raise RuntimeError("Gate returned non-array candlesticks")
                      return body
                  except urllib.error.HTTPError as e:
                      detail = e.read().decode("utf-8", "replace")[:400]
                      last_error = RuntimeError(f"Gate HTTP {e.code}: {detail}")
                      if e.code not in (429, 500, 502, 503, 504) or attempt == 3:
                          raise last_error
                  except (TimeoutError, urllib.error.URLError) as e:
                      last_error = e
                      if attempt == 3:
                          raise
                  time.sleep(min(8, 2 ** attempt))
              raise last_error or RuntimeError("Gate request failed")

          contract_req = urllib.request.Request(base + "/contracts", headers={"Accept":"application/json","User-Agent":"V8-read-only-kline-audit/2.0"})
          with urllib.request.urlopen(contract_req, timeout=30) as r:
              contracts = json.load(r)
          known = {str(x.get("name","")).upper(): x for x in contracts if isinstance(x, dict)}

          def resolve_gate_contract(symbol, catalog_contract):
              compact = str(catalog_contract or "").upper().replace("-", "_")
              candidates = [compact]
              if compact.endswith("USDT"):
                  candidates.append(compact[:-4] + "_USDT")
              candidates.append(str(symbol).upper() + "_USDT")
              return next((x for x in candidates if x in known), None)

          resolved = {sym: resolve_gate_contract(sym, contract) for sym, contract in symbols}
          valid = {sym: resolved[sym] is not None for sym, _ in symbols}
          if not any(valid.values()):
              raise SystemExit("No catalog entries resolved to Gate USDT futures contracts.")

          def valid_candle(item):
              try:
                  t = int(item.get("t", 0))
                  o, h, l, c = (float(item[k]) for k in ("o","h","l","c"))
                  return t > 0 and all(math.isfinite(v) and v > 0 for v in (o,h,l,c)) and h >= max(o,c) and l <= min(o,c) and h >= l
              except (TypeError, ValueError, KeyError, AttributeError):
                  return False

          def get_series(contract, interval, step):
              # Same direction as V8 latest(): get newest page first, then page backward.
              newest = api({"contract":contract, "interval":interval, "limit":PAGE})
              rows = [int(x["t"]) for x in newest if valid_candle(x)]
              rows = sorted(set(rows))
              if not rows:
                  return [], False, 0
              cursor = rows[0]
              pages = 0
              history_boundary_reached = cursor <= start
              while cursor > start:
                  older_from = max(start, cursor - PAGE * step)
                  older_to = cursor - 1
                  if older_to <= older_from:
                      history_boundary_reached = True
                      break
                  batch = api({"contract":contract, "interval":interval, "from":older_from, "to":older_to})
                  parsed = sorted(set(int(x["t"]) for x in batch if valid_candle(x)))
                  time.sleep(0.12)
                  if not parsed:
                      # Empty older range confirms the exchange listing/history boundary.
                      history_boundary_reached = True
                      break
                  older = [t for t in parsed if t < cursor]
                  if not older:
                      raise RuntimeError("Backward pagination stalled: API did not return older timestamps")
                  rows = sorted(set(rows).union(older))
                  next_cursor = min(older)
                  if next_cursor >= cursor:
                      raise RuntimeError("Backward pagination did not move")
                  cursor = next_cursor
                  pages += 1
                  if pages > 500:
                      raise RuntimeError("Backward pagination exceeded 500-page safety limit")
              return rows, history_boundary_reached, pages

          def gaps(ts, step):
              out = []
              for i in range(1, len(ts)):
                  prev, cur = ts[i-1], ts[i]
                  delta = cur - prev
                  misaligned = (prev % step != 0 or cur % step != 0 or delta % step != 0)
                  if delta > step or misaligned:
                      out.append((prev + step, cur - step, max(0, delta // step - 1), misaligned))
              return out

          def expected_latest(tf_step):
              step_ms = tf_step * 1000
              bucket = (now * 1000 // step_ms) * step_ms
              within = now * 1000 - bucket
              return (bucket - step_ms - (step_ms if within < min(120000, step_ms / 10) else 0)) // 1000

          def add(sym, contract, tf, interval, step, ts, history_boundary_reached=False, history_pages=0, error=None):
              gs = gaps(ts, step) if ts else []
              expected = expected_latest(step)
              latest = ts[-1] if ts else None
              lag = ((expected-latest)//step if latest is not None and expected > latest else 0) if latest is not None else ""
              if error:
                  status = "ERROR"
              elif not ts:
                  status = "NO_DATA"
              elif not history_boundary_reached:
                  status = "INCOMPLETE_HISTORY"
              elif gs or latest < expected-step:
                  status = "FAIL"
              else:
                  status = "PASS"
              report.append({
                  "symbol":sym, "catalog_contract":next(x[1] for x in symbols if x[0]==sym),
                  "contract":contract or "", "timeframe":tf, "api_interval":interval,
                  "contract_valid":bool(contract), "candles":len(ts),
                  "history_boundary_reached":bool(history_boundary_reached), "history_pages":history_pages,
                  "first_utc":datetime.datetime.fromtimestamp(ts[0],datetime.timezone.utc).isoformat() if ts else "",
                  "last_utc":datetime.datetime.fromtimestamp(latest,datetime.timezone.utc).isoformat() if latest else "",
                  "expected_latest_utc":datetime.datetime.fromtimestamp(expected,datetime.timezone.utc).isoformat(),
                  "latest_lag_bars":lag, "gap_count":len(gs), "gap_examples":json.dumps(gs[:5]),
                  "status":status, "error":str(error)[:400] if error else ""
              })

          def aggregate_2h(rows):
              groups = {}
              for t in sorted(set(rows)):
                  bucket = (t // 7200) * 7200
                  groups.setdefault(bucket, []).append(t)
              current_hour = (now // 3600) * 3600
              current_bucket = (current_hour // 7200) * 7200
              out = []
              for bucket, items in groups.items():
                  items.sort()
                  if len(items)==2 and items[0]==bucket and items[1]==bucket+3600 and (bucket+7200<=current_hour or (bucket==current_bucket and items[1]==current_hour)):
                      out.append(bucket)
                  elif len(items)==1 and bucket==current_bucket and items[0]==current_hour:
                      out.append(bucket)
              return sorted(out)

          for sym, catalog_contract in symbols:
              contract = resolved[sym]
              if not contract:
                  for tf, interval, step in [("1H","1h",3600),("2H","1h-paired",7200),("4H","4h",14400),("8H","8h",28800),("D","1d",86400)]:
                      add(sym, "", tf, interval, step, [], error="No exact Gate USDT futures contract match")
                  continue
              h1 = None
              try:
                  h1, h1_boundary, h1_pages = get_series(contract, "1h", 3600)
                  add(sym, contract, "1H", "1h", 3600, h1, h1_boundary, h1_pages)
              except Exception as e:
                  add(sym, contract, "1H", "1h", 3600, [], error=e)
              if h1 is None:
                  add(sym, contract, "2H", "1h-paired", 7200, [], error="Cannot aggregate: 1H source request failed")
              else:
                  add(sym, contract, "2H", "1h-paired", 7200, aggregate_2h(h1), h1_boundary, h1_pages)
              for tf, interval, step in [("4H","4h",14400),("8H","8h",28800),("D","1d",86400)]:
                  try:
                      ts, boundary_reached, history_pages = get_series(contract, interval, step)
                      add(sym, contract, tf, interval, step, ts, boundary_reached, history_pages)
                  except Exception as e:
                      add(sym, contract, tf, interval, step, [], error=e)

          out = Path("v8-kline-audit")
          out.mkdir(exist_ok=True)
          fields = ["symbol","catalog_contract","contract","timeframe","api_interval","contract_valid","candles","history_boundary_reached","history_pages","first_utc","last_utc","expected_latest_utc","latest_lag_bars","gap_count","gap_examples","status","error"]
          with (out/"report.csv").open("w", newline="") as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader()
              w.writerows(report)
          (out/"report.json").write_text(json.dumps({"generated_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"symbols":len(symbols),"checks":len(report),"results":report},indent=2))
          counts = {k:sum(x["status"]==k for x in report) for k in ("PASS","FAIL","INCOMPLETE_HISTORY","NO_DATA","ERROR")}
          if len(report) != 110:
              raise SystemExit(f"Audit incomplete: expected 110 rows, got {len(report)}")
          summary = "## V8 K-line audit (V8 controller pagination parity)\n\n"
          summary += f"- Instruments: {sum(valid.values())}/22 exact Gate contracts\n- Full-history boundaries confirmed: {sum(bool(x['history_boundary_reached']) for x in report)}/110 checks\n- Checks: {len(report)}/110\n"
          summary += "".join(f"- {k}: {v}\n" for k,v in counts.items())
          summary += "\n| Symbol | Gate contract | TF | Candles | Boundary | Pages | Gaps | Lag bars | Status |\n|---|---|---:|---:|---|---:|---:|---:|---|\n"
          summary += "".join(f"| {x['symbol']} | {x['contract']} | {x['timeframe']} | {x['candles']} | {x['history_boundary_reached']} | {x['history_pages']} | {x['gap_count']} | {x['latest_lag_bars']} | {x['status']} |\n" for x in report)
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary)
          print(summary)
          bad = [x for x in report if x["status"] != "PASS"]
          if bad:
              raise SystemExit(f"Full-history audit found {len(bad)} non-PASS rows.")
          PY
          python /tmp/audit.py
      - name: Upload full audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-kline-audit
          path: v8-kline-audit/
          if-no-files-found: warn
          retention-days: 14
