name: V8 read-only K-line audit

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/v8-kline-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit all instruments and timeframes against Gate
        env:
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: |
          cat > /tmp/audit.py <<'PY'
          import csv, json, re, time, datetime, urllib.request, urllib.parse
          from pathlib import Path

          catalog = Path("modules/shared/instrument-catalog.js").read_text()
          defs = re.findall(r'\["([^"]+)","([^"]+)","([^"]+)","([^"]+)","([^"]+)"\]', catalog)
          if len(defs) != 22:
              raise SystemExit(f"Expected 22 catalog entries, found {len(defs)}")
          symbols = [(x[0], x[1]) for x in defs]
          base = "https://api.gateio.ws/api/v4/futures/usdt"
          now = int(time.time())
          start = now - 365 * 86400
          report = []
          contract_req = urllib.request.Request(base + "/contracts", headers={"Accept":"application/json","User-Agent":"V8-read-only-kline-audit/1.0"})
          with urllib.request.urlopen(contract_req, timeout=30) as r:
              contracts = json.load(r)
          known = {str(x.get("name","")).upper(): x for x in contracts if isinstance(x, dict)}
          def resolve_gate_contract(symbol, catalog_contract):
              # V8 catalog stores compact display IDs (e.g. BTCUSDT); Gate API
              # futures contract IDs use an underscore before settlement (BTC_USDT).
              compact = str(catalog_contract or "").upper().replace("-", "_")
              candidates = [compact]
              if compact.endswith("USDT"):
                  candidates.append(compact[:-4] + "_USDT")
              candidates.append(str(symbol).upper() + "_USDT")
              for candidate in candidates:
                  if candidate in known:
                      return candidate
              return None
          resolved = {sym: resolve_gate_contract(sym, contract) for sym, contract in symbols}
          valid = {sym: resolved[sym] is not None for sym, _ in symbols}
          if not any(valid.values()):
              raise SystemExit("No catalog entries resolved to Gate USDT futures contracts; refusing to publish an all-zero audit.")

          def get_candles(contract, interval, step):
              # Match V8 range pagination: bounded from/to windows, no oversized limit.
              rows, cursor = [], start
              while cursor <= now:
                  end = min(now, cursor + 1999 * step)
                  params = urllib.parse.urlencode({"contract":contract,"interval":interval,"from":cursor,"to":end})
                  req = urllib.request.Request(base + "/candlesticks?" + params, headers={"Accept":"application/json","User-Agent":"V8-read-only-kline-audit/1.0"})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          batch = json.load(r)
                  except urllib.error.HTTPError as e:
                      detail = e.read().decode("utf-8", "replace")[:500]
                      raise RuntimeError(f"Gate HTTP {e.code}: {detail}") from e
                  if not isinstance(batch, list):
                      raise RuntimeError("unexpected API payload")
                  if not batch:
                      break
                  parsed = [int(item.get("t", 0)) for item in batch if int(item.get("t", 0)) > 0]
                  if not parsed:
                      break
                  rows.extend(parsed)
                  nxt = max(parsed) + step
                  if nxt <= cursor:
                      raise RuntimeError("Gate pagination stalled")
                  cursor = nxt
                  time.sleep(0.12)
              return sorted(set(rows))

          def gaps(ts, step):
              return [(ts[i-1], ts[i], max(0,(ts[i]-ts[i-1])//step-1)) for i in range(1,len(ts)) if ts[i]-ts[i-1] != step or ts[i-1] % step or ts[i] % step]

          def add(sym, contract, tf, interval, step, ts):
              gs = gaps(ts, step)
              step_ms = step * 1000
              bucket_ms = (now * 1000 // step_ms) * step_ms
              within_bucket_ms = now * 1000 - bucket_ms
              expected = (bucket_ms - step_ms - (step_ms if within_bucket_ms < min(120000, step_ms / 10) else 0)) // 1000
              latest = ts[-1] if ts else None
              report.append({
                  "symbol":sym,"catalog_contract":next((x[1] for x in symbols if x[0]==sym),""),"contract":contract,"timeframe":tf,"api_interval":interval,
                  "contract_valid":valid[sym],"candles":len(ts),
                  "first_utc":datetime.datetime.fromtimestamp(ts[0],datetime.timezone.utc).isoformat() if ts else "",
                  "last_utc":datetime.datetime.fromtimestamp(latest,datetime.timezone.utc).isoformat() if latest else "",
                  "expected_latest_utc":datetime.datetime.fromtimestamp(expected,datetime.timezone.utc).isoformat(),
                  "latest_lag_bars":((expected-latest)//step if latest is not None and expected>latest else 0) if latest is not None else "",
                  "gap_count":len(gs),"gap_examples":json.dumps(gs[:5]),
                  "status":"FAIL" if not valid[sym] or not ts or gs or latest is None or latest < expected-step else "PASS"
              })

          for sym, catalog_contract in symbols:
              contract = resolved[sym]
              if not contract:
                  for tf, interval, step in [("1H","1h",3600),("2H","2h",7200),("4H","4h",14400),("8H","8h",28800),("1D","1d",86400)]:
                      report.append({"symbol":sym,"catalog_contract":catalog_contract,"contract":"","timeframe":tf,"contract_valid":False,"candles":0,"gap_count":"","gap_examples":"","status":"INVALID_CONTRACT","error":"No exact Gate USDT futures contract match"})
                  continue
              try:
                  h1 = get_candles(contract,"1h",3600)
                  add(sym,contract,"1H","1h",3600,h1)
                  # Match the V8 construction: a 2H candle exists only for a complete, aligned pair of 1H candles.
                  h2 = []
                  by_t = set(h1)
                  for t in h1:
                      if t % 7200 == 0 and t+3600 in by_t and t+7200 <= now:
                          h2.append(t)
                  add(sym,contract,"2H","1h-paired",7200,sorted(set(h2)))
                  for tf, interval, step in [("4H","4h",14400),("8H","8h",28800),("1D","1d",86400)]:
                      add(sym,contract,tf,interval,step,get_candles(contract,interval,step))
              except Exception as e:
                  for tf in ("1H","2H","4H","8H","1D"):
                      if not any(x["symbol"]==sym and x["timeframe"]==tf for x in report):
                          report.append({"symbol":sym,"contract":contract,"timeframe":tf,"status":"ERROR","error":str(e)[:300],"candles":0,"gap_count":"","gap_examples":""})
                  time.sleep(1)

          out = Path("v8-kline-audit")
          out.mkdir(exist_ok=True)
          with (out/"report.csv").open("w",newline="") as f:
              w=csv.DictWriter(f,fieldnames=sorted({k for x in report for k in x}))
              w.writeheader(); w.writerows(report)
          (out/"report.json").write_text(json.dumps({"generated_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"symbols":len(symbols),"checks":len(report),"results":report},indent=2))
          passed=sum(x.get("status")=="PASS" for x in report)
          failed=sum(x.get("status")=="FAIL" for x in report)
          errors=sum(x.get("status")=="ERROR" for x in report)
          invalid=sum(x.get("status")=="INVALID_CONTRACT" for x in report)
          summary=f"## V8 K-line audit\n\n- Instruments: {sum(valid.values())}/22 resolved to Gate contracts\n- Checks: {len(report)}/110\n- PASS: {passed}\n- FAIL: {failed}\n- INVALID CONTRACT: {invalid}\n- ERROR: {errors}\n\n| Symbol | Gate contract | Timeframe | Candles | Gaps | Latest lag (bars) | Status |\n|---|---|---|---:|---:|---:|---|\n"
          summary += "".join(f"| {x['symbol']} | {x.get('contract','')} | {x['timeframe']} | {x.get('candles','')} | {x.get('gap_count','')} | {x.get('latest_lag_bars','')} | {x.get('status')} |\n" for x in report)
          Path("/tmp/summary.md").write_text(summary)
          Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).write_text(summary)
          print(summary)
          PY
          python /tmp/audit.py
      - name: Upload full audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-kline-audit
          path: v8-kline-audit/
          if-no-files-found: warn
          retention-days: 14
