name: V8 browser K-line validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v8-browser-kline-check.yml"
      - "index.html"
      - "kline/**"
      - "modules/**"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v8-browser-kline-validation
  cancel-in-progress: false

jobs:
  browser-kline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout validation definition
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate deployed page across all 22 instruments and 5 timeframes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const baseUrl = 'https://mrajjqq.github.io/V8/';
          const symbols = ['MSFT','GOOGL','AMZN','NVDA','OPENAI','AMD','TSM','AVGO','ORCL','ARM','MU','ASML','SNDK','SKHYNIX','MRVL','GLW','HOOD','SPCX','BTC','HYPE','XAU','CL'];
          const timeframes = ['1H','2H','4H','8H','D'];
          const results = [];
          const pageErrors = [];
          const failedGateRequests = [];
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true });
          const page = await context.newPage();

          page.on('pageerror', error => pageErrors.push(String(error?.stack || error)));
          page.on('requestfailed', request => {
            if (request.url().includes('api.gateio.ws')) failedGateRequests.push({ url: request.url(), error: request.failure()?.errorText || 'request failed' });
          });
          page.on('response', response => {
            if (response.url().includes('api.gateio.ws') && response.status() >= 400) failedGateRequests.push({ url: response.url(), status: response.status() });
          });

          try {
            await page.goto(baseUrl + '?browser-validation=1', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => Boolean(window.V6Kline && document.querySelector('#kline-host canvas')), null, { timeout: 45000 });

            // This suite validates data loading, so pause the real rotation through its existing double-tap control.
            await page.evaluate(() => {
              const host = document.querySelector('#kline-host');
              const tap = pointerId => {
                const base = { bubbles: true, cancelable: true, pointerId, pointerType: 'touch', isPrimary: true, clientX: 16, clientY: 16, button: 0, buttons: 1 };
                host.dispatchEvent(new PointerEvent('pointerdown', base));
                host.dispatchEvent(new PointerEvent('pointerup', { ...base, buttons: 0 }));
              };
              tap(91); tap(92);
            });
            await page.waitForFunction(() => !document.querySelector('#app')?.classList.contains('is-symbol-transitioning'), null, { timeout: 10000 });
            await page.waitForFunction(() => Boolean(window.V6Kline?.state?.symbol), null, { timeout: 45000 });
            const pausedSymbol = await page.evaluate(() => window.V6Kline.state.symbol);
            await page.waitForTimeout(9000);
            const symbolAfterPause = await page.evaluate(() => window.V6Kline.state.symbol);
            if (pausedSymbol !== symbolAfterPause) throw new Error(`Automatic rotation did not pause: ${pausedSymbol} -> ${symbolAfterPause}`);

            await page.waitForFunction(() => window.V6Kline?.state?.count > 0, null, { timeout: 45000 });
            async function exerciseTouchGestures(label) {
              const result = await page.evaluate(() => {
                const canvas = [...document.querySelectorAll('#kline-host canvas')].find(node => !node.hasAttribute('aria-hidden'));
                const key = 'vegas-v6-kline-viewport-v2';
                if (!canvas) return { error: 'K-line canvas not found' };
                const before = JSON.parse(localStorage.getItem(key) || 'null');
                if (!before) return { error: 'Viewport state was not persisted before gesture testing' };
                const rect = canvas.getBoundingClientRect();
                const x = fraction => rect.left + rect.width * fraction;
                const y = fraction => rect.top + rect.height * fraction;
                const send = (type, id, px, py, buttons) => canvas.dispatchEvent(new PointerEvent(type, {
                  bubbles: true, cancelable: true, pointerId: id, pointerType: 'touch',
                  isPrimary: id === 1, clientX: px, clientY: py, button: 0, buttons
                }));
                send('pointerdown', 1, x(0.45), y(0.5), 1);
                send('pointermove', 1, x(0.50), y(0.5), 1);
                send('pointerup', 1, x(0.50), y(0.5), 0);
                const afterPan = JSON.parse(localStorage.getItem(key) || 'null');
                send('pointerdown', 2, x(0.40), y(0.5), 1);
                send('pointerdown', 3, x(0.60), y(0.5), 1);
                send('pointermove', 2, x(0.30), y(0.5), 1);
                send('pointermove', 3, x(0.70), y(0.5), 1);
                send('pointerup', 2, x(0.30), y(0.5), 0);
                send('pointerup', 3, x(0.70), y(0.5), 0);
                const afterPinch = JSON.parse(localStorage.getItem(key) || 'null');
                return {
                  panChanged: Boolean(afterPan && (afterPan.anchorTime !== before.anchorTime || afterPan.anchorOffset !== before.anchorOffset)),
                  pinchChanged: Boolean(afterPan && afterPinch && Math.abs(afterPinch.barW - afterPan.barW) > 0.1),
                  before, afterPan, afterPinch
                };
              });
              if (result.error || !result.panChanged || !result.pinchChanged) {
                throw new Error(`${label} touch gesture validation failed: ${JSON.stringify(result)}`);
              }
              console.log(JSON.stringify({ test: 'touch-gestures', viewport: label, panChanged: result.panChanged, pinchChanged: result.pinchChanged }));
            }
            await exerciseTouchGestures('phone');
            await page.setViewportSize({ width: 1024, height: 1366 });
            await page.waitForTimeout(350);
            await exerciseTouchGestures('tablet');
            await page.setViewportSize({ width: 390, height: 844 });
            await page.waitForTimeout(350);

            for (const timeframe of timeframes) {
              await page.evaluate(tf => window.V6Kline.setTimeframe(tf), timeframe);
              await page.waitForFunction(tf => window.V6Kline?.state?.timeframe === tf, timeframe, { timeout: 30000 });

              for (const symbol of symbols) {
                await page.evaluate(sym => window.V6Kline.select(sym), symbol);
                let observed = null;
                try {
                  await page.waitForFunction(({ sym, tf }) => {
                    const state = window.V6Kline?.state;
                    const host = document.querySelector('#kline-host');
                    return state?.symbol === sym &&
                      state?.timeframe === tf &&
                      state.count > 0 &&
                      host?.dataset.emaHistorySymbol === sym &&
                      Number(host?.dataset.emaHistoryCount || 0) > 0;
                  }, { sym: symbol, tf: timeframe }, { timeout: 18000 });
                  await page.waitForTimeout(180);
                  observed = await page.evaluate(() => {
                    const canvases = [...document.querySelectorAll('#kline-host canvas')];
                    return canvases.map(canvas => {
                      const ctx = canvas.getContext('2d');
                      let candlePixels = 0;
                      if (ctx && canvas.width && canvas.height) {
                        const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                        for (let i = 0; i < pixels.length; i += 4) {
                          const r = pixels[i], g = pixels[i + 1], b = pixels[i + 2], a = pixels[i + 3];
                          if (a > 0 && ((g > r * 1.25 && g > b * 1.05 && g > 80) || (r > g * 1.25 && r > b * 1.15 && r > 100))) candlePixels++;
                        }
                      }
                      return { width: canvas.width, height: canvas.height, candlePixels };
                    });
                  });
                  const state = await page.evaluate(() => window.V6Kline.state);
                  const candleCanvas = observed[0];
                  const ok = Boolean(candleCanvas && candleCanvas.width > 0 && candleCanvas.height > 0 && candleCanvas.candlePixels > 0);
                  results.push({ symbol, timeframe, ok, candleCount: state.count, canvases: observed });
                  console.log(JSON.stringify(results[results.length - 1]));
                } catch (error) {
                  const state = await page.evaluate(() => window.V6Kline?.state || null).catch(() => null);
                  results.push({ symbol, timeframe, ok: false, error: String(error?.message || error), state });
                  console.log(JSON.stringify(results[results.length - 1]));
                }
              }
            }
          } finally {
            await fs.writeFile('v8-browser-kline-results.json', JSON.stringify({ baseUrl, tested: results.length, passed: results.filter(x => x.ok).length, failed: results.filter(x => !x.ok).length, pageErrors, failedGateRequests, results }, null, 2));
            await browser.close();
          }

          const failed = results.filter(x => !x.ok);
          console.log(`BROWSER K-LINE RESULT: ${results.filter(x => x.ok).length}/${results.length} passed; ${failed.length} failed; ${pageErrors.length} page errors.`);
          if (results.length !== 110 || failed.length || pageErrors.length) process.exitCode = 1;
          NODE

      - name: Upload browser validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-browser-kline-validation
          path: v8-browser-kline-results.json
          if-no-files-found: warn
          retention-days: 14
