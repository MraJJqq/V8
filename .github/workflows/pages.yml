name: Build and Deploy VEGAS V8

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vegas-v8-pages
  cancel-in-progress: false

jobs:
  migrate-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V8
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch complete Media library
        run: git clone --no-checkout https://github.com/MraJJqq/Media.git /tmp/vegas-media

      - name: Migrate, validate and deploy V8
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/vegas-media
          MEDIA_SHA="$(tr -d '[:space:]' < .media-source-sha)"
          if [[ ! "$MEDIA_SHA" =~ ^[0-9a-f]{40}$ ]]; then echo "Invalid .media-source-sha"; exit 1; fi
          git -C "$SRC" checkout --detach "$MEDIA_SHA"
          mkdir -p docs tools
          printf '# Media source commit\n\n`%s`\n' "$MEDIA_SHA" > docs/MEDIA-SOURCE-COMMIT.md

          # Copy the complete seven-system runtime from the Media baseline, including aligned 2H history repair and its tests.
          cp -a "$SRC/V6/assets" .
          cp -a "$SRC/V6/cards" .
          cp -a "$SRC/V6/kline" .
          cp -a "$SRC/V6/tests" .
          cp -a "$SRC/V6/modules" .
          cp "$SRC/V6/index.html" ./index.html
          cp "$SRC/V6/README.md" docs/V6-BASELINE.md
          cp "$SRC/V6/OPERATING-FLOWS.md" docs/SEVEN-SYSTEMS.md

          # Copy all canonical Media asset collections.
          for dir in Backgrounds Brand Logos Cards Charts References Templates UI; do
            cp -a "$SRC/$dir" .
          done
          cp "$SRC/README.md" docs/MEDIA-LIBRARY-README.md

          # V8 branding only; runtime and display behavior remain Media-derived.
          sed -i 's/<title>VEGAS V6 · Gate<\/title>/<title>VEGAS V8 · Gate<\/title>/' index.html

          # Apply only V8-specific documentation identity; facts come directly from Media.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("docs/SEVEN-SYSTEMS.md")
          s = p.read_text(encoding="utf-8")
          s = s.replace("# VEGAS V6 — System Modules & Operating Flows", "# VEGAS V8 — System Modules & Operating Flows", 1)
          s = s.replace("This directory documents the seven V6 systems.", "This directory documents the seven V8 systems.", 1)
          s = s.replace("This Media-specific operating-flow document is not part of the V6 runtime repository.", "This V8 deployment document describes the seven-system runtime synchronized from the Media V6 baseline.", 1)
          s = s.replace("This package records the seven V6 systems.", "This package records the seven V8 systems.", 1)
          p.write_text(s, encoding="utf-8")
          PY

          cat > README.md <<'EOF'
          # VEGAS V8

          VEGAS V8 is rebuilt from the Media library's complete six-system website package. Runtime files, local dependencies, visual assets and operating rules are migrated together.

          ## 六大系统

          1. **K线系统**：Gate USDT 永续合约 K线、历史补齐、实时更新、缓存和 Vegas EMA。
          2. **统一视窗与手势系统**：五个周期共用一套页面级视窗状态。
          3. **滚动行情卡片系统**：22 个本地卡片、Gate 行情、点选、拖动和轮播。
          4. **Logo 与倒计时系统**：22 个启用品种 SVG 标识、淡入淡出切换和周期倒计时。
          5. **五周期系统**：**1H、2H、4H、8H、D**；2H 由 Gate 原始 1H K线按 UTC 两小时边界聚合。
          6. **全屏幕动态系统**：统一负责动态视口高度、横竖屏布局和安全区域适配。

          ## 数据与资源边界

          - K线与卡片行情：Gate USDT 永续合约。
                    - 22 个启用品种 Logo、字体、图标、CSS、模块和页面资源均在本仓库本地保存。
          - `Backgrounds/` 完整素材目录从锁定的 Media 提交同步；网页只通过实际引用路径加载背景。
          - 五个周期共用同一套视窗状态，不拆分为各周期独立视窗。

          ## 目录

          - `index.html`：V8 网页入口。
          - `assets/`、`cards/`、`kline/`、`modules/`：六大系统运行代码和本地依赖。
          - `Backgrounds/`、`Brand/`、`Logos/`、`Cards/`、`Charts/`、`References/`、`Templates/`、`UI/`：配套素材与规范。
          - `docs/SEVEN-SYSTEMS.md`：六大系统职责、运行流程和集成契约。
          - `tools/validate_v8.py`：V8 静态完整性检查。

          GitHub Pages 由 `.github/workflows/pages.yml` 自动部署。
          EOF

          touch .nojekyll
          python3 tools/validate_v8.py
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find . -name '*.js' -not -path './node_modules/*' -print0)
          npm install --prefix /tmp/v8-test-deps --no-save --package-lock=false fake-indexeddb@6.2.4
          ln -s /tmp/v8-test-deps/node_modules node_modules
          node --test tests/*.test.mjs
          rm node_modules

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild V8 from complete Media seven-system package"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload V8 website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Allow Pages artifact metadata to settle
        run: sleep 15

      - name: Deploy V8 website
        id: deployment
        uses: actions/deploy-pages@v4
