<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>银河斜带背景</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<script>
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function glow(x,cx,cy,r,rgb,a){
  const g=x.createRadialGradient(cx,cy,0,cx,cy,r);
  g.addColorStop(0,`rgba(${rgb},${a})`);
  g.addColorStop(.5,`rgba(${rgb},${a*.35})`);
  g.addColorStop(1,`rgba(${rgb},0)`);
  x.fillStyle=g;x.fillRect(cx-r,cy-r,r*2,r*2);
}
function star(x,px,py,r,rgb,a){
  glow(x,px,py,r*4,rgb,a*.35);
  x.fillStyle=`rgba(${rgb},${a})`;
  x.beginPath();x.arc(px,py,r,0,7);x.fill();
}
const cols=['255,255,255','200,220,255','255,235,215','180,200,255'];
function draw(){
  const c=document.getElementById('bg'),d=Math.min(window.devicePixelRatio||1,2);
  const w=c.clientWidth,h=c.clientHeight,m=Math.max(w,h);
  c.width=w*d;c.height=h*d;
  const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);
  const R=rng(42);
  x.fillStyle='#000';x.fillRect(0,0,w,h);
  x.globalCompositeOperation='lighter';
  const a=-0.5,ca=Math.cos(a),sa=Math.sin(a);
  for(let i=0;i<70;i++){
    const t=(i/69-.5)*m*1.3,off=(R()-.5)*h*.12;
    const px=w/2+ca*t-sa*off,py=h/2+sa*t+ca*off;
    const warm=R()<.35;
    glow(x,px,py,m*(.12+R()*.1),warm?'110,80,50':'35,55,120',warm?.05:.07);
  }
  for(let i=0;i<2600;i++){
    const t=(R()-.5)*m*1.4,off=(R()+R()+R()-1.5)*h*.2;
    const px=w/2+ca*t-sa*off,py=h/2+sa*t+ca*off;
    if(px<0||px>w||py<0||py>h)continue;
    star(x,px,py,R()*.5+.15,cols[(R()*4)|0],R()*.45+.1);
  }
  for(let i=0;i<420;i++)star(x,R()*w,R()*h,R()*.5+.2,cols[(R()*4)|0],R()*.4+.1);
  x.globalCompositeOperation='source-over';
  const v=x.createRadialGradient(w/2,h/2,m*.2,w/2,h/2,m*.8);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.7)');
  x.fillStyle=v;x.fillRect(0,0,w,h);
}
draw();
addEventListener('resize',draw);
</script>
</body>
</html>
